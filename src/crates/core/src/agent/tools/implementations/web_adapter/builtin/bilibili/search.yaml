site: bilibili
name: search
description: Search Bilibili videos
domain: www.bilibili.com
strategy: public
browser: false

args:
  query:
    type: string
    required: true
    description: Search keyword
  limit:
    type: int
    default: 20
    description: Number of results

pipeline:
  - fetch:
      url: "https://api.bilibili.com/x/web-interface/search/type?search_type=video&keyword=${{ args.query | urlencode }}&page_size=${{ args.limit }}"
  - select: data.result
  - map:
      rank: ${{ index + 1 }}
      title: ${{ item.title }}
      author: ${{ item.author }}
      plays: ${{ item.play }}
      url: "https://www.bilibili.com/video/${{ item.bvid }}"
  - limit: ${{ args.limit }}

columns: [rank, title, author, plays, url]
