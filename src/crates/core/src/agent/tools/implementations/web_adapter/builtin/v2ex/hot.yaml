site: v2ex
name: hot
description: V2EX hot topics
domain: www.v2ex.com
strategy: public
browser: false

args:
  limit:
    type: int
    default: 20
    description: Number of topics

pipeline:
  - fetch:
      url: "https://www.v2ex.com/api/topics/hot.json"
  - map:
      rank: ${{ index + 1 }}
      title: ${{ item.title }}
      replies: ${{ item.replies }}
      node: ${{ item.node.title }}
      author: ${{ item.member.username }}
      url: "https://www.v2ex.com/t/${{ item.id }}"
  - limit: ${{ args.limit }}

columns: [rank, title, replies, node, author, url]
