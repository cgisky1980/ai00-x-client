site: douban
name: movie-hot
description: Douban hot movies
domain: movie.douban.com
strategy: cookie
browser: true

args:
  limit:
    type: int
    default: 20
    description: Number of movies

pipeline:
  - navigate: "https://movie.douban.com/chart"
  - evaluate: |
      (async () => {
        await new Promise(r => setTimeout(r, 4000));
        const normalize = (v) => (v || '').replace(/\s+/g, ' ').trim();
        const limit = Math.max(1, Math.min(20, 50));
        const results = [];
        for (const el of Array.from(document.querySelectorAll('.item'))) {
          const titleEl = el.querySelector('.pl2 a');
          const title = normalize(titleEl?.textContent);
          let url = titleEl?.getAttribute('href') || '';
          if (!title || !url) continue;
          if (!url.startsWith('http')) url = 'https://movie.douban.com' + url;
          const rating = parseFloat(normalize(el.querySelector('.rating_nums')?.textContent)) || 0;
          const quote = normalize(el.querySelector('.inq')?.textContent);
          const info = normalize(el.querySelector('.pl2 p')?.textContent);
          const yearMatch = info.match(/\b(19|20)\d{2}\b/);
          results.push({ rank: results.length + 1, title, rating, quote, year: yearMatch?.[0] || '', url });
          if (results.length >= limit) break;
        }
        return results;
      })()

columns: [rank, title, rating, quote, year, url]
