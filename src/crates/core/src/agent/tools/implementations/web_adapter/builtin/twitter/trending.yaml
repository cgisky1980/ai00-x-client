site: twitter
name: trending
description: Twitter/X trending topics
domain: x.com
strategy: cookie
browser: true

args:
  limit:
    type: int
    default: 20
    description: Number of trends

pipeline:
  - navigate: "https://x.com/explore/tabs/trending"
  - evaluate: |
      (async () => {
        await new Promise(r => setTimeout(r, 3000));
        const limit = Math.max(1, Math.min(20, 50));
        const trends = [];
        const items = document.querySelectorAll('[data-testid="trend"]');
        for (const item of Array.from(items)) {
          try {
            const spans = item.querySelectorAll('span');
            const texts = Array.from(spans).map(s => s.textContent?.trim()).filter(Boolean);
            const name = texts[0] || '';
            const category = texts.length > 1 ? texts[texts.length - 2] : '';
            const count = texts.length > 2 ? texts[texts.length - 1] : '';
            if (!name) continue;
            trends.push({ rank: trends.length + 1, name, category, count });
            if (trends.length >= limit) break;
          } catch {}
        }
        return trends;
      })()

columns: [rank, name, category, count]
