site: hf
name: trending
description: Hugging Face trending models and spaces
domain: huggingface.co
strategy: public
browser: false

args:
  limit:
    type: int
    default: 20
    description: Number of items

pipeline:
  - fetch:
      url: "https://huggingface.co/api/trending"
  - select: recentModels
  - map:
      rank: ${{ index + 1 }}
      name: ${{ item.id }}
      author: ${{ item.author }}
      likes: ${{ item.likes }}
      downloads: ${{ item.downloads }}
      url: "https://huggingface.co/${{ item.id }}"
  - limit: ${{ args.limit }}

columns: [rank, name, author, likes, downloads, url]
