site: github
name: search
description: Search GitHub repositories
domain: github.com
strategy: public

args:
  query:
    type: str
    required: true
    positional: true
    description: Search query
  limit:
    type: int
    default: 10
    description: Max number of results
  sort:
    type: str
    default: stars
    choices: [stars, forks, updated]
    description: Sort by stars, forks, or recently updated

pipeline:
  - fetch:
      url: "https://api.github.com/search/repositories?q=${{ args.query | urlencode }}&sort=${{ args.sort }}&per_page=${{ args.limit }}"

  - select: items

  - map:
      name: "${{ item.full_name }}"
      description: "${{ item.description }}"
      stars: "${{ item.stargazers_count }}"
      language: "${{ item.language }}"
      url: "${{ item.html_url }}"

  - limit: ${{ args.limit }}

columns: [name, description, stars, language, url]
