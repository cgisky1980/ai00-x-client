# Ai00-X 编排架构 patch 静态头（版本限定资产，详见同目录 INTENT.md）。
# 由 dsh_manager::ensure_orchestration_patch 装配并幂等覆写 profile
# cordis.patch.yml；组合预览：dsh --profile ai00x --dump-config。
# 纪律：新增条目必须放 insert 列表（顶层裸行 = 覆盖既有条目）。
# 编排者 persona 由 build_workbench_preset_row 写入 workbench preset；部署级
# personaPrefix 会被 standard preset 覆盖，这里不再保留无效配置。
# 占位符：{BUNDLED_SKILLS_DIR}（装配期替换）。
- id: skill-filesystem
  config:
    bundledSkillDir: "{BUNDLED_SKILLS_DIR}"
