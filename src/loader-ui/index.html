<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ai00-X</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <script>
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      // 双属性对齐 web-ui ThemeService：data-theme=主题 id，data-theme-type=明暗档
      // （design-system token 覆盖选择器是 [data-theme-type='light']，仅设 data-theme 不生效）
      const applyTheme = (prefersDark) => {
        const theme = prefersDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-theme-type', theme);
        document.documentElement.style.backgroundColor = 'transparent';
      };
      applyTheme(mq.matches);
      // 系统主题切换实时跟随
      mq.addEventListener('change', (e) => applyTheme(e.matches));
    </script>
  </head>
  <body style="margin:0;padding:0;overflow:hidden;background-color:transparent;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
