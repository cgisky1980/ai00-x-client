<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Ai00-X 聊天</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* 首帧背景（tokens.css 加载前）：默认暗色松烟墨，亮色宣纸。
         Rust 建窗时若应用选了明/暗主题会注入 data-app-theme-type，优先于 OS 媒体查询；
         未注入（跟随系统）时两者本就一致。色值与 design-system token 同源：
         暗 oklch(0.27 0.006 240)、亮 oklch(0.96 0.008 90)。 */
      html {
        background-color: #242729;
      }
      html[data-app-theme-type='light'] {
        background-color: #f4f2ec;
      }
      html[data-app-theme-type='dark'] {
        background-color: #242729;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-app-theme-type]) {
          background-color: #f4f2ec;
        }
      }

      body {
        background-color: inherit;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/member-chat-main.tsx"></script>
  </body>
</html>
