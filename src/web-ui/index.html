<!doctype html>
<html lang="zh-CN" data-skin="soot-lime">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <title>Ai00-X - AI Code Assistant</title>
    <script>
      // 皮肤 × 明暗 首帧引导（与 web-ui ThemeService 同源：localStorage 镜像键 ai00-x:skin / ai00-x:theme-selection）
      // 必须双写 data-theme + data-theme-type：design-system 亮色档选择器是 [data-theme-type='light']
      (function () {
        var root = document.documentElement;
        var skin = null, sel = null;
        try { skin = localStorage.getItem('ai00-x:skin'); sel = localStorage.getItem('ai00-x:theme-selection'); } catch (e) {}
        var dark = sel === 'ai00-x-dark' || (sel !== 'ai00-x-light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.setAttribute('data-skin', skin || 'soot-lime');
        root.setAttribute('data-theme', dark ? 'ai00-x-dark' : 'ai00-x-light');
        root.setAttribute('data-theme-type', dark ? 'dark' : 'light');
      })();
    </script>
    <script>
      (function () {
        var isOverlay = window.location.pathname.indexOf('/main/') !== -1;
        var root = document.documentElement;
        if (isOverlay) {
          root.style.backgroundColor = 'transparent';
          root.classList.add('overlay-window');
        }
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      html.overlay-window {
        background-color: transparent !important;
      }
      
      body {
        background-color: inherit;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
