<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Ai00-X Chat</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      html {
        background-color: #242729;
      }
      @media (prefers-color-scheme: light) {
        html {
          background-color: #f4f1e8;
        }
      }

      body {
        background-color: inherit;
      }

      .chat-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #e6e6e8;
      }
      @media (prefers-color-scheme: light) {
        .chat-splash {
          color: #1f1f23;
        }
      }

      .chat-splash__spinner {
        width: 32px;
        height: 32px;
        border: 2.5px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        opacity: 0.5;
        animation: chat-splash-spin 0.8s linear infinite;
      }

      .chat-splash__text {
        font-size: 13px;
        letter-spacing: 0.5px;
        opacity: 0.55;
      }

      @keyframes chat-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="chat-splash">
        <div class="chat-splash__spinner"></div>
        <div class="chat-splash__text">Ai00-X</div>
      </div>
    </div>
    <script type="module" src="/src/chat-main.tsx"></script>
  </body>
</html>
