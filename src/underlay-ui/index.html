<!doctype html>
<html lang="zh-CN" data-skin="soot-lime">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script>
      // 皮肤 × 明暗 首帧引导（与 web-ui ThemeService 同源：localStorage 镜像键 ai00-x:skin / ai00-x:theme-selection）
      // 必须双写 data-theme + data-theme-type：design-system 亮色档选择器是 [data-theme-type='light']
      (function () {
        var root = document.documentElement;
        var skin = null, sel = null;
        try { skin = localStorage.getItem('ai00-x:skin'); sel = localStorage.getItem('ai00-x:theme-selection'); } catch (e) {}
        var dark = sel === 'ai00-x-dark' || (sel !== 'ai00-x-light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var motion = null;
        try { motion = localStorage.getItem('ai00-x:motion'); } catch (e) {}
        root.setAttribute('data-skin', skin || 'soot-lime');
        root.setAttribute('data-theme', dark ? 'ai00-x-dark' : 'ai00-x-light');
        root.setAttribute('data-theme-type', dark ? 'dark' : 'light');
        // 动效档：内置皮肤默认 full；显式设置优先于系统 prefers-reduced-motion,
        // 否则 Windows 自定义动画设置会让桌宠表情/动效被误关。
        root.setAttribute('data-motion', motion || 'full');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  </head>
  <body class="underlay-main">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Audio control: muted by default; wallpapers can request audio permission
      (function() {
        window.__ai00_audio_allowed = false;

        var mute = function(el) {
          try { el.muted = true; el.volume = 0; } catch(e) {}
        };

        var origPlay = HTMLMediaElement.prototype.play;
        HTMLMediaElement.prototype.play = function() {
          if (!window.__ai00_audio_allowed) {
            mute(this);
          }
          return origPlay.call(this);
        };

        var observer = new MutationObserver(function() {
          if (!window.__ai00_audio_allowed) {
            document.querySelectorAll('video, audio').forEach(mute);
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        // Listen for audio permission requests from wallpaper iframes
        window.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'ai00-request-audio') {
            window.__ai00_audio_allowed = true;
            // Unmute existing media elements
            document.querySelectorAll('video, audio').forEach(function(el) {
              try { el.muted = false; el.volume = 1; } catch(e) {}
            });
          }
          if (e.data && e.data.type === 'ai00-revoke-audio') {
            window.__ai00_audio_allowed = false;
            document.querySelectorAll('video, audio').forEach(mute);
          }
        });
      })();
    </script>
  </body>
</html>
