<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>paper-doll 树形试衣间（LPC 全库）</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; display: flex;
        background: #1a1c1e; color: #d8d5cf;
        font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #side {
        width: 340px; flex: none; display: flex; flex-direction: column;
        border-right: 1px solid #3a3d40; background: #1f2124;
      }
      #search {
        margin: 10px; padding: 6px 10px; flex: none;
        border: 1px solid #3a3d40; border-radius: 6px;
        background: #242729; color: #d8d5cf; font: inherit; outline: none;
      }
      #search:focus { border-color: #5d8ca8; }
      #tree { flex: 1; overflow-y: auto; padding: 0 10px 16px; }
      #tree details { margin: 2px 0; }
      #tree summary {
        cursor: pointer; user-select: none; padding: 3px 8px; border-radius: 6px;
        color: #b9b5ad; list-style: none;
      }
      #tree summary::-webkit-details-marker { display: none; }
      #tree summary::before { content: "▸ "; color: #8a8d90; }
      #tree details[open] > summary::before { content: "▾ "; }
      #tree summary:hover { background: #26282b; }
      #tree details.cat > summary { font-weight: 600; }
      #tree details.grp > summary { margin-left: 14px; font-size: 13px; }
      #tree .parts { margin-left: 28px; display: flex; flex-wrap: wrap; gap: 4px; }
      #tree .count { color: #6a6d70; font-weight: 400; font-size: 12px; }
      #tree button {
        padding: 2px 8px; border: 1px solid #3a3d40; border-radius: 5px;
        background: #242729; color: #d8d5cf; cursor: pointer; font: 12px/1.7 inherit;
      }
      #tree button:hover { border-color: #6a7c8c; }
      #tree button.on { background: #2f4653; border-color: #5d8ca8; color: #cfe6f2; }
      .hide { display: none !important; }
      #main {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; padding: 20px;
      }
      .stage-wrap {
        padding: 12px; border: 1px solid #3a3d40; border-radius: 8px;
        background:
          conic-gradient(#26282b 25%, #1f2124 0 50%, #26282b 0 75%, #1f2124 0) 0 0 / 24px 24px;
      }
      canvas { display: block; image-rendering: pixelated; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .row .label { color: #8a8d90; align-self: center; margin-right: 2px; }
      .row button {
        padding: 4px 14px; border: 1px solid #3a3d40; border-radius: 6px;
        background: #242729; color: #d8d5cf; cursor: pointer; font: inherit;
      }
      .row button:hover { border-color: #6a7c8c; }
      .row button.on { background: #2f4653; border-color: #5d8ca8; color: #cfe6f2; }
      #status { color: #8a8d90; font-size: 12px; min-height: 1.5em; text-align: center; }
      #equipped { color: #b9b5ad; font-size: 12px; max-width: 560px; text-align: center; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <aside id="side">
      <input id="search" type="search" placeholder="搜索部件（名称 / 路径）…" />
      <div id="tree"></div>
    </aside>
    <main id="main">
      <div class="stage-wrap"><canvas id="stage"></canvas></div>
      <div class="row" id="anims"><span class="label">动画</span></div>
      <div class="row" id="dirs"><span class="label">方向</span></div>
      <div class="row" id="scales"><span class="label">缩放</span></div>
      <div id="equipped"></div>
      <div id="status">载入中…</div>
    </main>
    <script type="module" src="./demo/main.ts"></script>
  </body>
</html>
