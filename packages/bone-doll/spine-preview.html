<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>bone-doll spine 比对台</title>
    <style>
      body { background: #1b1b22; color: #d6d6dc; font-family: Consolas, monospace; margin: 16px; }
      canvas { image-rendering: pixelated; border: 1px solid #3a3a46; background: #23232c; }
      h3 { margin: 8px 0 4px; font-weight: normal; color: #8f9bb3; }
      button { margin: 2px; padding: 4px 10px; background: #2b2b36; color: #d6d6dc; border: 1px solid #454555; cursor: pointer; }
      button.on { background: #4f7396; border-color: #6a8fb0; }
      .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .tag { color: #8f9bb3; margin-bottom: 4px; }
      input[type='range'] { vertical-align: middle; }
    </style>
  </head>
  <body>
    <h3>Spine 转换比对台（左 = BoneDoll 自研运行时 · 右 = spine-canvas 4.3）</h3>
    <div class="row">
      <div><div class="tag">BoneDoll</div><canvas id="bd" width="256" height="256"></canvas></div>
      <div><div class="tag">Spine</div><canvas id="sp" width="256" height="256"></canvas></div>
    </div>
    <h3>动画（两边同步播放）</h3>
    <div class="row" id="anims"></div>
    <h3>方向（= spine skin，切换两边同步）</h3>
    <div class="row" id="dirs"></div>
    <h3>控制</h3>
    <div class="row">
      <button id="playBtn" class="on">暂停</button>
      <button id="resetBtn">重置</button>
      <span>缩放 <input id="scale" type="range" min="1" max="8" step="1" value="4" /> <span id="scaleVal">4×</span></span>
    </div>
    <h3>换装（Spine 侧 slot attachment 切换，部件库变体）</h3>
    <div class="row">
      <select id="partsSel" style="background:#2b2b36;color:#d6d6dc;border:1px solid #454555;padding:4px 8px;min-width:220px"></select>
    </div>
    <p id="status"></p>
    <p><a href="/" style="color:#6a8fb0">→ playground</a> <a href="/editor.html" style="color:#6a8fb0">→ 关键帧编辑器</a></p>
    <script type="module" src="./demo/spine-preview.ts"></script>
  </body>
</html>
