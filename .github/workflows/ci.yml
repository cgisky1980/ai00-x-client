name: CI

# Re-scan registration

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel previous runs on same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Frontend: syntax checks only (no packaging) ───────────────────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check web UI
        run: pnpm run type-check:web

      - name: Lint web UI
        run: pnpm run lint:web

  # ── Rust: syntax checks only (cargo check / fmt / clippy) ─────────
  rust-check:
    name: Rust Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup OpenSSL (Windows, prebuilt)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/setup-openssl-windows.ps1

      - name: Install Linux system dependencies (Rust build)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PKG=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PKG=libwebkit2gtk-4.0-dev
          fi

          if apt-cache show libappindicator3-dev >/dev/null 2>&1; then
            APPINDICATOR_PKG=libappindicator3-dev
          else
            APPINDICATOR_PKG=libayatana-appindicator3-dev
          fi

          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libxdo-dev \
            libasound2-dev \
            "$WEBKIT_PKG" \
            "$APPINDICATOR_PKG" \
            librsvg2-dev \
            patchelf \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            tesseract-ocr-eng

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ci-check-${{ runner.os }}"

      # Linux runners only have ~16 GB RAM; cargo check / clippy on the full
      # workspace (incl. acestep/llama.cpp build.rs) can OOM-kill the runner
      # agent mid-build ("runner has received a shutdown signal"). Add swap as
      # a backstop and cap parallelism to keep peak memory in check.
      - name: Add swap space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "=== memory before swap ==="
          free -m
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=10
          echo "=== memory after adding 8G swap ==="
          free -m

      # tauri-build validates the resources in tauri.conf.json during cargo
      # check; CI only does syntax checks, so synthesize minimal placeholders.
      - name: Ensure placeholder resources (main.zip / underlay.zip / runtime)
        shell: bash
        run: node scripts/ci/ensure-placeholder-resources.mjs

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        env:
          CARGO_BUILD_JOBS: "3"
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
          LLAMA_BUILD_PARALLEL: "3"
          CARGO_INCREMENTAL: "0"
        run: cargo clippy --workspace --all-targets

      - name: Check compilation
        env:
          CARGO_BUILD_JOBS: "3"
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
          LLAMA_BUILD_PARALLEL: "3"
          CARGO_INCREMENTAL: "0"
        run: cargo check --workspace
