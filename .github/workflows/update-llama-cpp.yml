name: Update llama.cpp

# Re-scan registration touch (workflow permissions changed to write)

# 定期检测 ggml-org/llama.cpp 上游最新稳定版 release，若比当前 pin 的版本新，
# 则由 update-llama-cpp.mjs 更新版本常量与子模块指针，并自动提交拉取合并请求 (PR)。
# master 分支不稳定，因此始终跟随最新稳定版 tag，而非 master。

on:
  schedule:
    # 每天 02:17 UTC (中国时间 10:17) 检测一次
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-llama-cpp
  cancel-in-progress: true

jobs:
  update:
    name: Bump llama.cpp to latest stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect and bump llama.cpp
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 退出码 2 = 检测到更新并已修改；0 = 已是最新；1 = 出错。
          # 用 if 捕获退出码（默认 bash -e 会让非零退出码直接中止 shell）。
          if node scripts/update-llama-cpp.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              # 真实错误（exit 1 等），让本步骤失败以便排查
              echo "updater failed with exit code $code"
              exit "$code"
            fi
          fi

      - name: Create pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          branch: feat/update-llama-cpp
          base: master
          add-paths: |
            llama.cpp
            src/crates/inference/src/runtime/downloader.rs
            scripts/pack-runtime.mjs
          commit-message: |
            chore: bump llama.cpp to latest stable release

            Auto-generated by the Update llama.cpp workflow.
          title: 'chore: bump llama.cpp to latest stable release'
          body: |
            Auto-detected a newer stable llama.cpp release. The version constant
            and submodule pointer have been updated. Please review before merging.
          delete-branch: true
          labels: dependencies